services:
  keycloak:
    build: .
    command: ["start-dev", "--import-realm"]
    ports: ["127.0.0.1:${KC_PORT:-8080}:8080"]
    volumes:
      - ./examples/realm:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: dev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-admin-password
      KC_SPI_EVENTS_LISTENER__SNITCH__WEBHOOK_URL: http://receiver:8081/events
      KC_SPI_EVENTS_LISTENER__SNITCH__WEBHOOK_SECRET: dev-only-shared-secret
      KC_SPI_EVENTS_LISTENER__SNITCH__EVENT_TYPES: LOGIN,LOGIN_ERROR,LOGOUT
  receiver:
    build: examples/receiver
    environment:
      LISTEN_ADDR: ":8081"
      WEBHOOK_SECRET: dev-only-shared-secret
